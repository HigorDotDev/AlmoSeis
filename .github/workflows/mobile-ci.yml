# CI do app (mobile/, docs/08-mobile.md): tipos, lint e testes. O export web é conferido também (ADR-0053).
name: mobile-ci

# Push na main: rodado pelo mobile-release.yml (workflow_call), para não duplicar.
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - name: Export web (app do restaurante no navegador)
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_WEB_API_BASE_URL: https://api.example.invalid
