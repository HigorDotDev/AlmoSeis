# Ambiente local (docs/09-devops.md §9.2). Só desenvolvimento: senhas fixas e fracas de propósito.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almoseis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d almoseis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: